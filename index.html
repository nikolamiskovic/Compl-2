<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Weather Service</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <main class="container py-5">
    <section class="text-center bg-white p-4 shadow-sm">
      <h1 class="fw-light">Weather Service</h1>
      <p class="text-muted">We'll get the weather for you!</p>

      <div class="row justify-content-center g-3">
        <div class="col-md-4">
          <button id="locationBtn" class="btn btn-primary w-100">My location!</button>
        </div>

        <div class="col-md-4">
          <input id="cityInput" class="form-control" placeholder="Enter city here...">
        </div>
      </div>

      <div id="weatherResult" class="mt-4"></div>
    </section>

    <section class="text-center bg-white p-4 shadow-sm mt-5">
      <h2 class="fw-light">Latest requests</h2>
      <div id="latestRequests"></div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
